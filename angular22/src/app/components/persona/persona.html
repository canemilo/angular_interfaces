<p><strong>MODULO PERSONA</strong>MODULO PERSONA</p>




<h2>Nombre: {{nombreDog}}</h2>
<h3 [style.background]=" edad >= 18 ? 'green' : 'red'">
    Edad: {{edad}}</h3>
@if (edad >= 18) {
  <div>Es mayor de edad</div>
} @else {
  <div>Es menor de edad</div>
}

<button (click)="aumentarEdad()">"AUMENTAR"</button>
<button (click)="disminuirEdad()">"DISMINUIR"</button>


<h3>Lista de nombres</h3>
<ul>
  <li *ngFor="let nombre of listaNombre">
    {{nombre}}
  </li>
</ul>








<hr>
